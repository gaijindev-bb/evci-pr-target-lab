# EV-CI fixture: faithful functional replica of TrueLayer/truelayer-java
# .github/workflows/workflow-pr-fork.yml @ d4173ee2f1a2da4b5b77c7af1eb4e81d882b14eb
# Adaptations vs upstream (see DIFF.md): repo full_name prefix, stub reusable
# workflow bodies, canary secrets. Trigger + access-check logic is byte-identical
# in structure: pull_request_target [opened, synchronize] -> check-access on
# github.triggering_actor (require: write) -> gated downstream jobs that check
# out github.event.pull_request.head.sha (fork code) with repo secrets present.
name: Workflow for PR on forks

on:
  pull_request_target:
    types: [ opened, synchronize ]

jobs:
  check-access:
    if: ${{ ! startsWith(github.event.pull_request.head.repo.full_name, 'gaijindev-bb/evci-pr-target-lab') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dump actor context
        run: |
          echo "github.actor=${{ github.actor }}"
          echo "github.triggering_actor=${{ github.triggering_actor }}"
          echo "event=${{ github.event_name }} action=${{ github.event.action }}"
          echo "head.sha=${{ github.event.pull_request.head.sha }}"
          echo "head.repo.full_name=${{ github.event.pull_request.head.repo.full_name }}"
          echo "run_attempt=${{ github.run_attempt }} run_id=${{ github.run_id }}"
      - name: Get User Permission
        id: checkAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check User Permission
        if: steps.checkAccess.outputs.require-result == 'false'
        run: |
          echo "${{ github.triggering_actor }} does not have permissions on this repo."
          echo "Current permission level is ${{ steps.checkAccess.outputs.user-permission }}"
          echo "Job originally triggered by ${{ github.actor }}"
          exit 1
  build-test-coverage:
    needs: check-access
    uses: ./.github/workflows/build-test-coverage.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      coveralls_repo_token: ${{ secrets.COVERALLS_REPO_TOKEN }}
  acceptance-tests:
    needs: build-test-coverage
    uses: ./.github/workflows/acceptance-tests.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      tl_client_id: ${{ secrets.ACCEPTANCE_TEST_CLIENT_ID }}
      tl_client_secret: ${{ secrets.ACCEPTANCE_TEST_CLIENT_SECRET }}
      tl_signing_key_id: ${{ secrets.ACCEPTANCE_TEST_SIGNING_KEY_ID }}
      tl_signing_private_key: ${{ secrets.ACCEPTANCE_TEST_SIGNING_PRIVATE_KEY }}
  release-snapshot:
    needs: [build-test-coverage, acceptance-tests]
    uses: ./.github/workflows/release-snapshot.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      project_version: ${{ needs.build-test-coverage.outputs.project_version }}
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      maven_central_signing_key: ${{ secrets.PGP_SIGNING_IN_MEMORY_KEY }}
      maven_central_signing_key_password: ${{ secrets.PGP_SIGNING_IN_MEMORY_KEY_PASSWORD }}
